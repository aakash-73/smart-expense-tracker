server:
  port: 8083

spring:
  application:
    name: analytics-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/smart-expense-tracker}
    auto-index-creation: true

  config:
    import: optional:file:../.env[.properties]

logging:
  level:
    root: INFO
    com.smarttracker: DEBUG
