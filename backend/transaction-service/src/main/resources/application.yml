server:
  port: 8082

spring:
  application:
    name: transaction-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/smart-expense-tracker}

  config:
    import: optional:file:../.env[.properties]

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.smarttracker: DEBUG

jwt:
  secret: ${JWT_SECRET}
