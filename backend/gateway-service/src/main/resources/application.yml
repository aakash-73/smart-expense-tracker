server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        - id: transaction-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/transactions/**
          filters:
            - StripPrefix=0

        - id: budget-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/budgets/**
          filters:
            - StripPrefix=0

        - id: analytics-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/analytics/**
          filters:
            - StripPrefix=0

        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=0

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

  config:
    import: optional:file:../.env[.properties]

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
